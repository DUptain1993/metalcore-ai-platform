# Stage 5 - Song assembly & rendering configuration.
# Consumed by inference (see inference/config.py::AssemblyConfig).

# MusicGen output is mono/32 kHz; we assemble at 32 kHz then upsample on export.
work_sample_rate: 32000
export_sample_rate: 44100

# Section arrangement. Each section is generated by MusicGen (Stage 2) from its
# prompt, then cross-faded into the full instrumental. Edit freely.
sections:
  - name: intro
    prompt: "atmospheric metalcore intro, ambient clean guitar, building tension"
    seconds: 12.0
  - name: verse
    prompt: "metalcore verse, tight palm-muted rhythm guitar, driving drums"
    seconds: 16.0
  - name: chorus
    prompt: "melodic metalcore chorus, soaring lead guitar, big drums, emotional"
    seconds: 16.0
  - name: breakdown
    prompt: "heavy metalcore breakdown, downtuned chugging guitar, double bass, half-time"
    seconds: 14.0
  - name: bridge
    prompt: "ambient metalcore bridge, reverb-drenched lead, sparse drums"
    seconds: 12.0
  - name: final_chorus
    prompt: "climactic metalcore final chorus, layered leads, huge dynamics"
    seconds: 18.0
  - name: outro
    prompt: "metalcore outro, fading ambient guitar, resolving"
    seconds: 10.0

# Cross-fade between adjacent sections (seconds).
crossfade_seconds: 1.0

# Mixing.
instrumental_gain_db: 0.0
vocal_gain_db: -1.0
stereo_width: 0.2            # 0 = mono, up to ~0.6 for a wide master

# Mastering.
target_lufs: -9.0            # loud, metalcore-style master
export_mp3: true
mp3_bitrate: "320k"

# MusicGen generation controls (used when the assembler generates instrumentals).
guidance_scale: 3.0
seed: 42
