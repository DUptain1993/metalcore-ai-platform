name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the CPU path is exercised in CI. GPU stages (2/3/4 training & inference)
# are verified on Kaggle via the notebooks — GitHub runners have no GPU.
jobs:
  cpu-checks:
    name: CPU checks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install ffmpeg (MP3/M4A decode + export)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          # Stage 1 deps + the light DSP deps used by the Stage 4/5 smoke test.
          pip install -r requirements-dataset.txt -r requirements-assembly.txt

      - name: Byte-compile all packages (syntax check, no GPU imports)
        run: |
          python -m compileall -q metalcore dataset_tools music_training \
            lyric_training rvc_training inference scripts

      - name: Stage 1 end-to-end smoke test
        run: bash scripts/smoke_test.sh

      - name: Self-contained DSP smoke test (Stages 4 & 5)
        run: PYTHONPATH=. python scripts/smoke_test_dsp.py
